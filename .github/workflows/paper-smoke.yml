name: Paper server smoke test

# Starts an actual Paper server and verifies plugin startup and command registration.
# Gameplay AI still needs human-driven integration testing on complex structures.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: gradle clean build --no-daemon -PminecraftVersion=26.2 -PpaperApiVersion=26.2.build.129-stable
      - name: Download latest stable Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          UA='MinecraftSiegeSurvival-CI/0.1 (https://github.com/bymatej/MinecraftSiegeSurvival)'
          url=$(curl -fsSL -H "User-Agent: $UA" \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds \
            | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          test -n "$url" || { echo 'No stable Paper download available' >&2; exit 1; }
          curl -fLsS --retry 3 -H "User-Agent: $UA" -o paper.jar "$url"
          test "$(stat -c %s paper.jar)" -gt 10000000
      - name: Run server and verify plugin initialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          cp build/libs/MSS-*.jar smoke/plugins/
          mv paper.jar smoke/paper.jar
          printf 'eula=true\n' > smoke/eula.txt
          printf 'online-mode=false\nlevel-seed=42\nview-distance=3\nsimulation-distance=3\nmax-players=2\nspawn-protection=0\n' > smoke/server.properties
          cd smoke
          # The server generates a disposable world. Console commands verify registration.
          { sleep 105; echo 'siege status'; echo 'siege help'; sleep 5; echo 'stop'; } |
            timeout 180 java -Xms1G -Xmx2G -jar paper.jar nogui > server.log 2>&1 || {
              cat server.log
              exit 1
            }
          grep -q 'SiegeSurvival enabled' server.log
          grep -q 'No active siege' server.log
          if grep -E 'Error occurred while enabling SiegeSurvival|Could not load.*SiegeSurvival' server.log; then
            echo 'Plugin initialization failed.' >&2
            exit 1
          fi
      - name: Upload server log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-log
          path: smoke/server.log
