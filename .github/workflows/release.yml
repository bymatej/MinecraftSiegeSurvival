name: Publish versioned release

# Publishing is deliberately manual: pushes/PRs only produce CI artifacts.
on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft/Paper version, e.g. 26.2'
        required: true
        type: string
        default: '26.2'
      plugin_version:
        description: 'Plugin version, e.g. 0.1-beta or 1.1'
        required: true
        type: string
        default: '0.1-beta'
      paper_build:
        description: 'Stable Paper API build suffix, e.g. 129-stable for 26.2 (verify against Paper)'
        required: true
        type: string
        default: '129-stable'
      prerelease:
        description: 'Mark as pre-release until Paper integration tests are complete'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mss-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs and source branch
        id: release
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          PAPER_BUILD: ${{ inputs.paper_build }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Publish releases from main only.' >&2
            exit 1
          fi
          if [[ ! "$MC_VERSION" =~ ^[0-9]{2}\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'Minecraft version must look like 26.2 or 26.1.2.' >&2
            exit 1
          fi
          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z][a-z0-9.-]*)?$ ]]; then
            echo 'Plugin version must look like 0.1-beta, 1.1 or 1.1.2.' >&2
            exit 1
          fi
          if [[ ! "$PAPER_BUILD" =~ ^[1-9][0-9]*-stable$ ]]; then
            echo 'Only explicit stable Paper API builds are allowed (e.g. 129-stable).' >&2
            exit 1
          fi
          echo "tag=MSS-${MC_VERSION}.${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "paper_api=${MC_VERSION}.build.${PAPER_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build and test against requested Paper API
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          PAPER_API: ${{ steps.release.outputs.paper_api }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean build --no-daemon \
            "-PminecraftVersion=$MC_VERSION" \
            "-PpluginVersion=$PLUGIN_VERSION" \
            "-PpaperApiVersion=$PAPER_API"

      - name: Verify published JAR name and plugin.yml metadata
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          mc = os.environ["MC_VERSION"]
          plugin = os.environ["PLUGIN_VERSION"]
          name = f"MSS-{mc}.{plugin}.jar"
          path = pathlib.Path("build/libs") / name
          if not path.is_file():
              raise SystemExit(f"Missing expected JAR: {path}")
          with zipfile.ZipFile(path) as jar:
              descriptor = jar.read("plugin.yml").decode("utf-8")
          if f"version: '{plugin}'" not in descriptor:
              raise SystemExit("plugin.yml does not contain selected plugin version")
          if f"api-version: '{mc}'" not in descriptor:
              raise SystemExit("plugin.yml does not contain selected Minecraft API version")
          print(f"Verified {name} and embedded plugin.yml metadata")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VERSION: ${{ inputs.minecraft_version }}
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          PAPER_API: ${{ steps.release.outputs.paper_api }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Refusing to move it." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          ## Minecraft Siege Survival $PLUGIN_VERSION

          - **Minecraft/Paper:** $MC_VERSION
          - **Plugin version:** $PLUGIN_VERSION
          - **Compiled against:** Paper API $PAPER_API
          - **Required Java:** 25

          Download the $RELEASE_TAG.jar asset and place it in the Paper server plugins/ folder.

          **Important:** Siege block mining and complex fortress pathfinding are experimental.
          Back up your world before testing. Read the repository README for limitations.
          EOF
          flags=()
          if [[ "$PRERELEASE" == true || "$PLUGIN_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "build/libs/$RELEASE_TAG.jar" \
            --title "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --notes-file release-notes.md "${flags[@]}"
